[project]
name = "f1-race-analysis"
version = "0.1.0"
description = "Real-time F1 race analysis from dual-stream screen OCR + audio ASR, narrated by an LLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.7",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "python-dotenv>=1.2.2",
    "pywebpush>=2.3.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# backend/*.py import each other as bare modules (`import push`, `import
# retrieval`), matching how they're actually run (`uvicorn app:app
# --app-dir backend`, which puts backend/ on sys.path) -- pythonpath here
# instead of a conftest.py sys.path hack reproduces the same layout tests
# actually run under.
pythonpath = ["backend"]
testpaths = ["backend/tests"]
